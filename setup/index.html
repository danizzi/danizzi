<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>danizzi | Setup</title>
  <link rel="icon" href="../site/images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../site/src/styles.css?v=5" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../home/">
        <img src="../site/images/danizzilogo.png" alt="Danizzi Logo" class="brand-logo" />
      </a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="../home/">About Me</a>
        <a href="./" class="active">Setup</a>
        <a href="../fivem/">FiveM</a>
      </nav>
    </div>
  </header>

  <main class="page-main container reveal">
    <h1>Gaming Setup</h1>

    <section class="setup-showcase">
      <article class="setup-showcase-item">
        <div class="setup-showcase-image">
          <img src="./images/headset.png" alt="Headset" />
        </div>
        <p class="setup-showcase-category">HEADSET</p>
        <h3 class="setup-showcase-name">Logitech G Pro X 2<br>Lightspeed</h3>
      </article>

      <article class="setup-showcase-item">
        <div class="setup-showcase-image">
          <img src="./images/monitor.png" alt="Monitor" />
        </div>
        <p class="setup-showcase-category">MONITOR</p>
        <h3 class="setup-showcase-name">Asus VG248QG</h3>
      </article>

      <article class="setup-showcase-item">
        <div class="setup-showcase-image">
          <img src="./images/mousepad.png" alt="Mousepad" />
        </div>
        <p class="setup-showcase-category">MOUSEPAD</p>
        <h3 class="setup-showcase-name">SteelSeries QcK Heavy</h3>
      </article>

      <article class="setup-showcase-item">
        <div class="setup-showcase-image">
          <img src="./images/mouse.png" alt="Mouse" />
        </div>
        <p class="setup-showcase-category">MOUSE</p>
        <h3 class="setup-showcase-name">Logitech G Pro X<br>Superlight 2 Black</h3>
      </article>

    <article class="setup-showcase-item">
      <div class="setup-showcase-image">
        <img src="./images/keyboard.png" alt="Keyboard" />
      </div>
      <p class="setup-showcase-category">KEYBOARD</p>
      <h3 class="setup-showcase-name">ROG Strix Scope TKL</h3>
      <ul class="setup-specs">
      </ul>
    </article>

    <article class="setup-showcase-item">
      <div class="setup-showcase-image">
        <img src="./images/2ndmonitor.png" alt="Second Monitor" />
      </div>
      <p class="setup-showcase-category">SECOND MONITOR</p>
      <h3 class="setup-showcase-name">Asus VG248QE</h3>
      <ul class="setup-specs">
      </ul>
    </article>

    
  </main>

  <script src="../site/src/main.js?v=3" defer></script>
  <script data-goatcounter="https://dani.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
